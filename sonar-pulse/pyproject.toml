[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-pulse"
version = "0.1.0"
description = "A Python-based network reconnaissance and port scanning framework."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Mayank"}
]

dependencies = []

[project.scripts]
sonar-pulse = "sonar_pulse.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]